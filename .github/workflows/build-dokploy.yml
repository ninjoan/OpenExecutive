# Build the API and UI images and publish them to GHCR for the Dokploy
# deployment (docker/docker-compose.dokploy.yml pulls them by tag).
#
# Why images are built here rather than on the Dokploy host: the target box is
# a 4-vCPU Ampere instance that also runs everything else on the server, and
# the API image compiles/downloads torch (sentence-transformers) plus
# onnxruntime (fastembed). Building on the host makes every deploy a multi-hour
# CPU hog and couples deploy time to whatever else is running there.
#
# Runners are `ubuntu-24.04-arm` — GitHub's NATIVE arm64 hosted runners, free
# on public repositories. This matters: the Dokploy host is aarch64, and the
# alternative (buildx + QEMU emulation on an x86 runner) is roughly an order of
# magnitude slower for a build this heavy. If this repo is ever made private,
# these runners become billable — switch to a self-hosted arm64 runner or
# accept QEMU rather than silently paying for it.

name: Build images (Dokploy)

on:
  push:
    branches: [deploy/dokploy]
  workflow_dispatch:
    inputs:
      target:
        description: "Which image to build"
        required: true
        default: "both"
        type: choice
        options: [both, api, ui]

concurrency:
  group: build-dokploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase: GHCR rejects uppercase path segments, and
  # `github.repository` here would expand to `ninjoan/OpenExecutive`.
  IMAGE_API: ghcr.io/ninjoan/openexecutive-api
  IMAGE_UI: ghcr.io/ninjoan/openexecutive-ui

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Compare against the previous commit on THIS branch. Without an
          # explicit base, paths-filter diffs against the repository default
          # branch, and since deploy/dokploy permanently carries its own
          # commits (this workflow, the compose file, the mcp pin) every filter
          # matched on every push and nothing was ever skipped. Naming the same
          # ref makes paths-filter use the push event's before-commit instead.
          base: ${{ github.ref_name }}
          filters: |
            api:
              - 'packages/core/**'
              - 'knowledge/**'
              # Fixtures live at the repo root and are baked into the API image
              # (docker/Dockerfile COPYs fixtures/), so a fixtures-only change
              # still needs a rebuild.
              - 'fixtures/**'
              - 'docker/Dockerfile'
              - 'docker/workspace-mcp-launch.sh'
              - '.github/workflows/build-dokploy.yml'
            ui:
              - 'packages/ui/**'
              - 'docker/Dockerfile.ui'
              - '.github/workflows/build-dokploy.yml'
            # The compose file is the deployment manifest: editing an env var,
            # a healthcheck or a network changes what runs on the host without
            # changing either image. Without this filter such a push builds
            # nothing, so the redeploy job below would be skipped and the change
            # would silently never reach the server.
            compose:
              - 'docker/docker-compose.dokploy.yml'

  build-api:
    name: Build API image
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'api'))
      || (github.event_name == 'push' && needs.changes.outputs.api == 'true')
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-dokploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          # `latest` is what the compose file pulls by default; the sha tag is
          # what you pin to when rolling back (set OPENEXEC_IMAGE_TAG in the
          # Dokploy environment to `sha-<short>`).
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The heavy layers here are the model bakes (sentence-transformers
          # under HF_HOME, fastembed under FASTEMBED_CACHE_PATH). Caching them
          # turns a cold ~30min build into a few minutes when only app code
          # changed. mode=max keeps intermediate stages, which is what makes
          # the dependency layer reusable.
          cache-from: type=gha,scope=dokploy-api
          cache-to: type=gha,mode=max,scope=dokploy-api

  build-ui:
    name: Build UI image
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'ui'))
      || (github.event_name == 'push' && needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-dokploy-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_UI }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dokploy-ui
          cache-to: type=gha,mode=max,scope=dokploy-ui

  redeploy:
    name: Trigger Dokploy redeploy
    needs: [changes, build-api, build-ui]
    # `always()` plus the result checks: a push that only touches the UI skips
    # build-api, and a skipped needs-job would otherwise cancel this one. We
    # redeploy when nothing FAILED and there is something new to deploy —
    # either a freshly built image, or a compose-file change that alters what
    # runs on the host without rebuilding anything.
    #
    # This is the ONLY thing that deploys. Dokploy's own git trigger is
    # deliberately off: it fires the moment the branch is pushed, which is
    # while these builds are still running, so it would pull the previous
    # `latest` and report a green deploy of stale images.
    if: >-
      always()
      && needs.build-api.result != 'failure'
      && needs.build-ui.result != 'failure'
      && (needs.build-api.result == 'success'
          || needs.build-ui.result == 'success'
          || needs.changes.outputs.compose == 'true')
    runs-on: ubuntu-latest
    steps:
      # Fail loud rather than let a green run imply a deploy that never
      # happened — the same reasoning as the token preflight in deploy.yml.
      - name: Preflight — webhook configured
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK secret not set."
            echo "Copy it from the Dokploy Compose service -> Deployments -> Webhook URL."
            echo "The panel sits behind Cloudflare Zero Trust Access, so the call must"
            echo "get past Access too — either a Service Auth policy (set"
            echo "CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET) or a Bypass policy"
            echo "on the webhook path."
            exit 1
          fi
          # A half-configured service token silently degrades into an
          # unauthenticated call, which Access answers with a login page. Refuse
          # the pair rather than debug a 302 later.
          if { [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -z "$CF_ACCESS_CLIENT_SECRET" ]; } \
            || { [ -z "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; }; then
            echo "::error::Set BOTH CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET, or neither."
            exit 1
          fi
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            echo "Cloudflare Access service token present — authenticating to Access."
          else
            echo "No service token — the webhook path must have an Access Bypass policy."
          fi

      - name: Redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Secrets travel via env, never inlined into the command, so the URL
          # (which carries Dokploy's refresh token) stays out of the rendered
          # script and any `set -x` style trace.
          args=(-sS -X POST -o /tmp/body -w '%{http_code}')
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            args+=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID")
            args+=(-H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          code=$(curl "${args[@]}" "$WEBHOOK")
          echo "HTTP $code"
          cat /tmp/body
          # Cloudflare Access answers an unauthenticated call with a 302 to its
          # login page, which curl reports as a perfectly happy redirect. Treat
          # anything that is not 2xx as a failure so that case is not silent.
          case "$code" in
            2*) ;;
            30*) echo "::error::Webhook returned $code — Cloudflare Access redirected to its login page. The service token is wrong, or the path has no Bypass policy."; exit 1 ;;
            *) echo "::error::Dokploy webhook returned $code"; exit 1 ;;
          esac
